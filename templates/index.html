<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShrimpLock: Photo Roast Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,700;1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --panel: rgba(14, 20, 32, 0.75);
      --border: rgba(0, 240, 255, 0.25);
      --neon-cyan: #00f0ff;
      --neon-green: #54ff7e;
      --neon-yellow: #ffd728;
      --neon-red: #ff2e4e;
      --text: #e6f1ff;
      --text-muted: #8b9bb4;
      --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 20%, var(--neon-cyan) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: var(--glow-cyan);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
      letter-spacing: 1px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .glass-card {
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .dropzone {
      border: 2px dashed rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      position: relative;
      background: rgba(0, 240, 255, 0.02);
      transition: all 0.25s ease;
    }

    .dropzone.dragover, .dropzone:hover {
      border-color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.06);
      box-shadow: var(--glow-cyan);
    }

    .dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 0.8rem;
    }

    .btn {
      font-family: 'Chakra Petch', sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
      color: #000;
      font-weight: 700;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: transform 0.15s ease, filter 0.2s ease;
      margin-top: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(0, 240, 255, 0.1);
      box-shadow: var(--glow-cyan);
    }

    /* Loader */
    #loader {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 0;
      gap: 1.25rem;
    }

    .radar-spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      position: relative;
      border: 2px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .radar-spinner::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--neon-cyan);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Results layout */
    #results {
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .badge {
      display: inline-block;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      width: fit-content;
    }

    .badge-HUMAN {
      background: rgba(84, 255, 126, 0.15);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 15px rgba(84, 255, 126, 0.3);
    }

    .badge-PISA {
      background: rgba(255, 215, 40, 0.15);
      border: 1px solid var(--neon-yellow);
      color: var(--neon-yellow);
      box-shadow: 0 0 15px rgba(255, 215, 40, 0.3);
    }

    .badge-SHRIMP {
      background: rgba(255, 46, 78, 0.15);
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
      box-shadow: 0 0 15px rgba(255, 46, 78, 0.3);
    }

    .roast-banner {
      background: rgba(0, 0, 0, 0.4);
      border-left: 4px solid var(--neon-cyan);
      padding: 1.25rem 1.5rem;
      border-radius: 0 8px 8px 0;
      font-size: 1.15rem;
      font-style: italic;
      line-height: 1.5;
    }

    .grid-dashboard {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid-dashboard {
        grid-template-columns: 1fr;
      }
    }

    .preview-container {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .preview-container img {
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: contain;
      display: block;
    }

    .stats-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: space-between;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .metric-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--neon-cyan);
    }

    .action-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .error-msg {
      color: var(--neon-red);
      font-weight: 700;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="title">🦐 ShrimpLock: Photo Roast</h1>
    <p class="subtitle">AI SITTING POSTURE DIAGNOSTICS & VERBAL DISCIPLINE</p>
  </header>

  <main class="container">
    <!-- Upload Form -->
    <div class="glass-card">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp" />
        <div class="dropzone-icon">📸</div>
        <h3>DRAG & DROP SITTING PHOTO</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.3rem;">Supports JPG, PNG, WEBP</p>
        <button type="button" class="btn" onclick="document.getElementById('fileInput').click()">Upload Photo</button>
      </div>
      <div id="loader">
        <div class="radar-spinner"></div>
        <p style="letter-spacing: 2px; color: var(--neon-cyan); font-size: 0.9rem;">EXTRACTING SPINAL SKELETON...</p>
      </div>
      <p id="errorBox" class="error-msg"></p>
    </div>

    <!-- Results Section -->
    <div id="results" class="glass-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <div id="postureBadge" class="badge">STATE</div>
          <h2 id="resultTitle" style="font-family: 'Chakra Petch'; margin-top: 0.4rem; font-size: 1.6rem;"></h2>
        </div>
      </div>

      <div class="roast-banner" id="roastQuote"></div>

      <div class="grid-dashboard">
        <div class="preview-container">
          <img id="annotatedImg" alt="Posture Analysis Visualizer" />
        </div>

        <div class="stats-card">
          <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <div class="metric-row">
              <span class="metric-label">Shoulder Horizontal Tilt</span>
              <span class="metric-value" id="valShoulder">0.0°</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">Forward Neck Angle</span>
              <span class="metric-value" id="valNeck">0.0°</span>
            </div>
            <div class="metric-row">
              <span class="metric-label">Torso Lean Off-Vertical</span>
              <span class="metric-value" id="valTorso">0.0°</span>
            </div>
          </div>

          <div class="action-row">
            <button class="btn btn-secondary" id="btnReplay">🔊 Replay Roast</button>
            <button class="btn btn-secondary" onclick="resetApp()">↺ Analyze Another</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // --- Web Audio API Synthesizer (Zero-Asset SFX) ---
    const AudioEngine = {
      ctx: null,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      playAngelic() {
        this.init();
        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.50]; // C Major Chord
        freqs.forEach((freq, index) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + index * 0.05);

          gain.gain.setValueAtTime(0, now + index * 0.05);
          gain.gain.linearRampToValueAtTime(0.08, now + index * 0.05 + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.05 + 1.8);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + index * 0.05);
          osc.stop(now + index * 0.05 + 1.8);
        });
      },

      playWoodCreak() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const mod = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        const masterGain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.linearRampToValueAtTime(55, now + 0.5);

        mod.type = 'square';
        mod.frequency.setValueAtTime(25, now);
        modGain.gain.setValueAtTime(140, now);

        mod.connect(modGain);
        modGain.connect(osc.frequency);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(250, now + 0.5);

        masterGain.gain.setValueAtTime(0.25, now);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(filter);
        filter.connect(masterGain);
        masterGain.connect(this.ctx.destination);

        mod.start(now);
        osc.start(now);
        mod.stop(now + 0.5);
        osc.stop(now + 0.5);
      },

      playFaahhh() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        // Descending comedic fail dive
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2000, now);
        filter.frequency.exponentialRampToValueAtTime(180, now + 0.8);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.8);
      },

      trigger(soundName) {
        if (soundName === 'angelic') this.playAngelic();
        else if (soundName === 'wood_creak') this.playWoodCreak();
        else if (soundName === 'faahhh') this.playFaahhh();
      }
    };

    // --- Web Speech API Engine ---
    let lastComment = "";
    function speakRoast(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.05;
      utterance.pitch = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const roboticVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Zira')));
      if (roboticVoice) {
        utterance.voice = roboticVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    // --- Drag & Drop & Upload Handling ---
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('errorBox');
    const results = document.getElementById('results');

    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        uploadPhoto(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        uploadPhoto(e.target.files[0]);
      }
    });

    async function uploadPhoto(file) {
      errorBox.style.display = 'none';
      dropzone.style.display = 'none';
      loader.style.display = 'flex';

      const formData = new FormData();
      formData.append('image', file);

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          body: formData,
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Analysis failed. Please check your photo.');
        }

        renderResults(data);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        dropzone.style.display = 'block';
      } finally {
        loader.style.display = 'none';
      }
    }

    function renderResults(data) {
      lastComment = data.roast_comment;

      // Update UI elements
      const badge = document.getElementById('postureBadge');
      badge.className = `badge badge-${data.posture_state}`;
      badge.textContent = `STATUS: ${data.posture_state}`;

      document.getElementById('resultTitle').textContent = data.title;
      document.getElementById('roastQuote').textContent = `"${data.roast_comment}"`;
      document.getElementById('valShoulder').textContent = `${data.shoulder_angle}°`;
      document.getElementById('valNeck').textContent = `${data.neck_angle}°`;
      document.getElementById('valTorso').textContent = `${data.torso_angle}°`;
      document.getElementById('annotatedImg').src = data.annotated_image_base64;

      results.style.display = 'flex';
      results.scrollIntoView({ behavior: 'smooth' });

      // Trigger Audio & TTS Commentary
      AudioEngine.trigger(data.sound_trigger);
      setTimeout(() => {
        speakRoast(data.roast_comment);
      }, 500);
    }

    document.getElementById('btnReplay').addEventListener('click', () => {
      if (lastComment) speakRoast(lastComment);
    });

    function resetApp() {
      results.style.display = 'none';
      dropzone.style.display = 'block';
      fileInput.value = '';
      window.speechSynthesis.cancel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
